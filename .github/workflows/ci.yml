name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hatebr
          POSTGRES_PASSWORD: hatebr
          POSTGRES_DB: hatebr_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://hatebr:hatebr@localhost:5432/hatebr_teste
      JWT_SECRET: segredo-de-teste-do-ci-com-tamanho-suficiente
      RATE_LIMIT_ATIVO: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Migrations aplicam sem erro
        run: alembic upgrade head

      - name: Testes
        run: pytest --cov=app --cov-report=term-missing

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A imagem Docker builda
        run: docker build -t hatebr-api .
