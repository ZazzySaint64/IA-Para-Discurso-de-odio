services:
  - type: web
    name: hatebr-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hatebr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TREINO_HABILITADO
        value: "false"
      - key: RATE_LIMIT_ATIVO
        value: "true"

databases:
  - name: hatebr-db
    plan: free
