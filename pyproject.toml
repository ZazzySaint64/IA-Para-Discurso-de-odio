[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ guarda a spec e o plano: sao requisitos, nao codigo do projeto.
# Os scripts legados na raiz saem nas Tasks 9 e 14; reformata-los e ruido.
extend-exclude = ["docs", "classificador.py", "painel_treino.py", "dados_treino.py", "retreinar_modelo.py", "testar_modelo.py", "gerar_hash_senha.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
