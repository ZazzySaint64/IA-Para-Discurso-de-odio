[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ guarda a spec e o plano: sao requisitos, nao codigo do projeto.
# Os scripts legados na raiz saem nas Tasks 9 e 14; reformata-los e ruido.
# alembic/versions guarda migrations autogeradas: nao vale a pena reformatar
# a cada `alembic revision --autogenerate`.
extend-exclude = ["docs", "classificador.py", "painel_treino.py", "dados_treino.py", "retreinar_modelo.py", "testar_modelo.py", "gerar_hash_senha.py", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) como default de argumento e o padrao do FastAPI para injecao de dependencia.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
