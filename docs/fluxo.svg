<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#0e1117" />

  <!-- Datasets -->
  <rect x="30" y="40" width="180" height="70" rx="10" fill="#1f2937" stroke="#374151" />
  <text x="120" y="68" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="600">HateBR + ToLD-BR</text>
  <text x="120" y="88" fill="#9ca3af" font-size="12" text-anchor="middle">datasets originais</text>

  <!-- Feedback -->
  <rect x="30" y="150" width="180" height="70" rx="10" fill="#1f2937" stroke="#374151" />
  <text x="120" y="178" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="600">feedback_treino.csv</text>
  <text x="120" y="198" fill="#9ca3af" font-size="12" text-anchor="middle">os rótulos</text>

  <!-- Painel treino -->
  <rect x="30" y="260" width="180" height="80" rx="10" fill="#312e1f" stroke="#8a6d1f" />
  <text x="120" y="290" fill="#facc15" font-size="14" text-anchor="middle" font-weight="600">painel_treino.py</text>
  <text x="120" y="308" fill="#d1b93f" font-size="12" text-anchor="middle">só eu, com senha</text>
  <text x="120" y="324" fill="#d1b93f" font-size="12" text-anchor="middle">🔒 protegido</text>

  <!-- Arrow feedback -> csv -->
  <path d="M120,300 L120,225" stroke="#8a6d1f" stroke-width="2" fill="none" marker-end="url(#seta)" />

  <!-- dados_treino.py -->
  <rect x="330" y="110" width="190" height="80" rx="10" fill="#1f2937" stroke="#374151" />
  <text x="425" y="140" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="600">dados_treino.py</text>
  <text x="425" y="158" fill="#9ca3af" font-size="12" text-anchor="middle">junta tudo</text>
  <text x="425" y="174" fill="#9ca3af" font-size="12" text-anchor="middle">datasets + feedback</text>

  <path d="M210,75 L330,140" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#seta)" />
  <path d="M210,185 L330,155" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#seta)" />

  <!-- retreinar_modelo.py -->
  <rect x="580" y="110" width="190" height="80" rx="10" fill="#1f2937" stroke="#374151" />
  <text x="675" y="140" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="600">retreinar_modelo.py</text>
  <text x="675" y="158" fill="#9ca3af" font-size="12" text-anchor="middle">TF-IDF + Regressão</text>
  <text x="675" y="174" fill="#9ca3af" font-size="12" text-anchor="middle">Logística, 5-fold CV</text>

  <path d="M520,150 L580,150" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#seta)" />

  <!-- Modelo -->
  <rect x="580" y="240" width="190" height="70" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="675" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="600">modelo + vetorizador</text>
  <text x="675" y="286" fill="#9ca3af" font-size="12" text-anchor="middle">.pkl (o "cérebro")</text>

  <path d="M675,190 L675,240" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#seta)" />

  <!-- Classificador -->
  <rect x="580" y="350" width="190" height="60" rx="10" fill="#152a1f" stroke="#1f6b3d" />
  <text x="675" y="376" fill="#4ade80" font-size="14" text-anchor="middle" font-weight="600">classificador.py</text>
  <text x="675" y="394" fill="#86e0a8" font-size="12" text-anchor="middle">🌐 público</text>

  <path d="M675,310 L675,350" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#seta)" />

  <!-- painel treino -> retreinar (loop) -->
  <path d="M210,300 C 400,340 500,260 580,180" stroke="#8a6d1f" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#seta)" />
  <text x="360" y="345" fill="#8a6d1f" font-size="12">"Atualizar modelo agora"</text>
</svg>
